<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O:NA Project WRAITH | Forearm OS v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050505;
            color: #00ff41;
            overflow-x: hidden;
            user-select: none; /* Prevents highlighting text while tapping */
        }

        /* Scanline effect */
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0, 255, 65, 0.04) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        /* Active finger glow */
        .finger-btn.active {
            background-color: #00ff41;
            color: #000;
            box-shadow: 0 0 15px #00ff41;
            border-color: #00ff41;
        }

        .thumb-btn:active {
            background-color: #008f11;
            transform: scale(0.98);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #003300; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #005500; 
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-between p-4 relative">

    <div class="scanline"></div>

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center border-b border-green-900 pb-2 mb-4">
        <div>
            <h1 class="text-xl font-bold tracking-widest text-green-500">PROJECT WRAITH</h1>
            <p class="text-xs text-green-800">OVERRIDE: NEURAL ALLIANCE</p>
        </div>
        <div class="text-right">
            <div id="connection-status" class="text-xs text-green-500 animate-pulse">● SYSTEM ONLINE</div>
            <div id="mode-display" class="text-sm font-bold border border-green-800 px-2 py-0.5 mt-1 bg-green-900/20">MODE: IDLE</div>
        </div>
    </header>

    <!-- Main Display (Notepad) -->
    <main class="w-full max-w-md flex-grow flex flex-col gap-4">
        
        <!-- System Log / Feedback -->
        <div id="system-log" class="text-xs text-green-700 h-6 overflow-hidden">
            > Initializing EMG Sensors... OK.
        </div>

        <!-- Editor Screen -->
        <div class="relative flex-grow border border-green-700 bg-black/80 p-4 rounded-sm shadow-[0_0_10px_rgba(0,255,65,0.1)]">
            <!-- Background Grid -->
            <div class="absolute inset-0 pointer-events-none" 
                 style="background-image: linear-gradient(#001100 1px, transparent 1px), linear-gradient(90deg, #001100 1px, transparent 1px); background-size: 20px 20px; opacity: 0.5;">
            </div>
            
            <textarea id="notepad" readonly 
                class="w-full h-full bg-transparent border-none outline-none resize-none text-green-400 font-mono text-lg z-10 relative crt-flicker"
                placeholder="Waiting for input..."></textarea>
                
            <!-- Buffer Display (Floating UI) -->
            <div class="absolute bottom-2 right-2 flex flex-col items-end pointer-events-none z-20">
                <div id="hex-buffer" class="text-xs text-green-600 mb-1">BUFFER: EMPTY</div>
                <div id="binary-preview" class="text-3xl font-bold text-green-500 opacity-80">0000</div>
                <div id="hex-preview" class="text-sm text-green-300">HEX: 0 (0)</div>
            </div>
        </div>

    </main>

    <!-- Controls (The Arm Plate) -->
    <footer class="w-full max-w-md mt-6 mb-2">
        
        <!-- Finger Toggles -->
        <div class="grid grid-cols-4 gap-3 mb-4">
            <!-- Pinky (8) -->
            <button onclick="toggleFinger('pinky')" id="btn-pinky" class="finger-btn h-24 rounded border border-green-800 bg-black text-green-600 flex flex-col items-center justify-end pb-2 transition-all duration-100">
                <div class="h-full w-1 bg-green-900/30 mb-2 rounded-full relative overflow-hidden">
                    <div id="bar-pinky" class="absolute bottom-0 w-full bg-green-500 transition-all duration-300 h-0"></div>
                </div>
                <span class="text-xs font-bold">PNK</span>
                <span class="text-[10px] opacity-50">8</span>
            </button>

            <!-- Ring (4) -->
            <button onclick="toggleFinger('ring')" id="btn-ring" class="finger-btn h-24 rounded border border-green-800 bg-black text-green-600 flex flex-col items-center justify-end pb-2 transition-all duration-100">
                <div class="h-full w-1 bg-green-900/30 mb-2 rounded-full relative overflow-hidden">
                    <div id="bar-ring" class="absolute bottom-0 w-full bg-green-500 transition-all duration-300 h-0"></div>
                </div>
                <span class="text-xs font-bold">RNG</span>
                <span class="text-[10px] opacity-50">4</span>
            </button>

            <!-- Middle (2) -->
            <button onclick="toggleFinger('middle')" id="btn-middle" class="finger-btn h-24 rounded border border-green-800 bg-black text-green-600 flex flex-col items-center justify-end pb-2 transition-all duration-100">
                <div class="h-full w-1 bg-green-900/30 mb-2 rounded-full relative overflow-hidden">
                    <div id="bar-middle" class="absolute bottom-0 w-full bg-green-500 transition-all duration-300 h-0"></div>
                </div>
                <span class="text-xs font-bold">MID</span>
                <span class="text-[10px] opacity-50">2</span>
            </button>

            <!-- Index (1) -->
            <button onclick="toggleFinger('index')" id="btn-index" class="finger-btn h-24 rounded border border-green-800 bg-black text-green-600 flex flex-col items-center justify-end pb-2 transition-all duration-100">
                <div class="h-full w-1 bg-green-900/30 mb-2 rounded-full relative overflow-hidden">
                    <div id="bar-index" class="absolute bottom-0 w-full bg-green-500 transition-all duration-300 h-0"></div>
                </div>
                <span class="text-xs font-bold">IDX</span>
                <span class="text-[10px] opacity-50">1</span>
            </button>
        </div>

        <!-- Thumb (Enter) -->
        <button onclick="pressThumb()" class="thumb-btn w-full h-16 rounded-md bg-green-900/40 border border-green-600 text-green-400 font-bold text-lg tracking-widest hover:bg-green-800/50 shadow-[0_0_10px_rgba(0,255,65,0.2)] flex items-center justify-center gap-2">
            <span class="text-2xl">⚡</span> THUMB (ENTER) <span class="text-2xl">⚡</span>
        </button>

        <div class="flex justify-between mt-4 text-[10px] text-green-900 uppercase">
            <span>Ref: O:NA v1.1</span>
            <span>Bat: 98%</span>
        </div>
    </footer>

    <!-- Logic Script -->
    <script>
        // --- State ---
        const fingers = {
            pinky: false,  // 8
            ring: false,   // 4
            middle: false, // 2
            index: false   // 1
        };

        let firstHexDigit = null; 
        let isCommandMode = false;
        let currentMode = "IDLE"; 

        // --- DOM Elements ---
        const notepad = document.getElementById('notepad');
        const binPreview = document.getElementById('binary-preview');
        const hexPreview = document.getElementById('hex-preview');
        const hexBuffer = document.getElementById('hex-buffer');
        const sysLog = document.getElementById('system-log');
        const modeDisplay = document.getElementById('mode-display');

        // --- Interaction Logic ---

        function toggleFinger(fingerName) {
            fingers[fingerName] = !fingers[fingerName];
            
            const btn = document.getElementById(`btn-${fingerName}`);
            const bar = document.getElementById(`bar-${fingerName}`);
            
            if (fingers[fingerName]) {
                btn.classList.add('active');
                bar.style.height = "100%";
            } else {
                btn.classList.remove('active');
                bar.style.height = "0";
            }

            updatePreviews();
        }

        function getBinaryValue() {
            let val = 0;
            if (fingers.pinky) val += 8;
            if (fingers.ring) val += 4;
            if (fingers.middle) val += 2;
            if (fingers.index) val += 1;
            return val;
        }

        function resetFingers() {
            fingers.pinky = false;
            fingers.ring = false;
            fingers.middle = false;
            fingers.index = false;

            ['pinky', 'ring', 'middle', 'index'].forEach(f => {
                document.getElementById(`btn-${f}`).classList.remove('active');
                document.getElementById(`bar-${f}`).style.height = "0";
            });
            updatePreviews();
        }

        function updatePreviews() {
            const val = getBinaryValue();
            const binStr = (fingers.pinky ? '1' : '0') + 
                           (fingers.ring ? '1' : '0') + 
                           (fingers.middle ? '1' : '0') + 
                           (fingers.index ? '1' : '0');
            
            binPreview.innerText = binStr;
            hexPreview.innerText = `HEX: ${val.toString(16).toUpperCase()} (${val})`;
        }

        function pressThumb() {
            const currentVal = getBinaryValue();
            
            // --- LOGIC TREE ---

            // 1. Check for Command Mode Start (Hex F / 15)
            if (currentVal === 15 && firstHexDigit === null && !isCommandMode) {
                isCommandMode = true;
                log("System: CMD MODE. Waiting for key...");
                hexBuffer.innerText = "BUFFER: [CMD]";
                hexBuffer.classList.add("text-red-500");
                resetFingers();
                return;
            }

            // 2. Execute Command
            if (isCommandMode) {
                executeCommand(currentVal);
                isCommandMode = false;
                hexBuffer.classList.remove("text-red-500");
                hexBuffer.innerText = "BUFFER: EMPTY";
                resetFingers();
                return;
            }

            // 3. Special Shortcut: Spacebar (0000 + Thumb)
            if (currentVal === 0 && firstHexDigit === null) {
                typeCharacter(" ");
                log("Input: SPACE");
                resetFingers();
                return;
            }

            // 4. Standard Typing: First Digit
            if (firstHexDigit === null) {
                firstHexDigit = currentVal;
                const hexChar = currentVal.toString(16).toUpperCase();
                hexBuffer.innerText = `BUFFER: ${hexChar}_`;
                log(`Buffered Hex: ${hexChar}`);
                resetFingers();
            } 
            // 5. Standard Typing: Second Digit & Resolve
            else {
                const secondHexDigit = currentVal;
                const asciiCode = (firstHexDigit * 16) + secondHexDigit;
                const char = String.fromCharCode(asciiCode);

                typeCharacter(char);
                log(`Resolved: '${char}'`);

                firstHexDigit = null;
                hexBuffer.innerText = "BUFFER: EMPTY";
                resetFingers();
            }
        }

        function executeCommand(val) {
            switch(val) {
                case 1: // F1
                    currentMode = "CHAT MODE (ANGHELO)";
                    modeDisplay.innerText = "MODE: CHAT";
                    modeDisplay.className = "text-sm font-bold border border-green-800 px-2 py-0.5 mt-1 bg-blue-900/50";
                    log(">> CMD: OPEN CHAT.");
                    playBeep('high');
                    break;
                case 2: // F2
                    log(">> CMD: REPLAY LAST AUDIO.");
                    playBeep('low');
                    break;
                case 3: // F3
                    currentMode = "STUDY MODE (RAG)";
                    modeDisplay.innerText = "MODE: STUDY";
                    modeDisplay.className = "text-sm font-bold border border-green-800 px-2 py-0.5 mt-1 bg-yellow-900/50";
                    log(">> CMD: STUDY MODE.");
                    playBeep('high');
                    break;
                case 0: // F0
                    currentMode = "IDLE";
                    modeDisplay.innerText = "MODE: IDLE";
                    modeDisplay.className = "text-sm font-bold border border-green-800 px-2 py-0.5 mt-1 bg-green-900/20";
                    log(">> CMD: BACK / CLOSE.");
                    playBeep('low');
                    break;
                // --- NEW COMMANDS FOR TEXT EDITING ---
                case 12: // Hex C (12) -> CLEAR
                    notepad.value = "";
                    log(">> CMD: SCREEN CLEARED.");
                    playBeep('low');
                    break;
                case 11: // Hex B (11) -> BACKSPACE
                    notepad.value = notepad.value.slice(0, -1);
                    log(">> CMD: BACKSPACE.");
                    playBeep('low');
                    break;
                default:
                    log(`>> UNKNOWN CMD: F + ${val.toString(16).toUpperCase()}`);
            }
        }

        function typeCharacter(char) {
            notepad.value += char;
            notepad.scrollTop = notepad.scrollHeight; 
        }

        function log(msg) {
            sysLog.innerText = "> " + msg;
            if(Math.random() > 0.8) {
                sysLog.style.textShadow = "2px 0 red";
                setTimeout(() => sysLog.style.textShadow = "none", 100);
            }
        }

        function playBeep(type) {
            const body = document.body;
            if (type === 'high') body.style.backgroundColor = "#001100";
            else body.style.backgroundColor = "#110000";
            
            setTimeout(() => {
                body.style.backgroundColor = "#050505";
            }, 100);
        }

        log("System Online v1.1.");

    </script>
</body>
</html>
